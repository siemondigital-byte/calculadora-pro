server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # el service worker y el manifest nunca se cachean en el edge:
    # el ritual de deploy depende de que sw.js llegue fresco (autocorreccion #1)
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # assets hasheados por Vite: cache larga e inmutable
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
