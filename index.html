/* =============================================================================
   Calculadora de Viabilidad Inmobiliaria Pro
   Design tokens & layout — recreated from the Ciclo de Riqueza handoff.
   ========================================================================== */

:root {
  --black:      #0A0A0C; /* base background */
  --navy:       #0F1B2D; /* cards, panels */
  --navy-up:    #16263D; /* elevated navy */
  --gold:       #E6C788; /* primary accent */
  --gold-deep:  #B8945A; /* secondary */
  --gold-hover: #F0D7A4; /* CTA hover */
  --cream:      #F4EFE6; /* headlines */
  --gray:       #D7D7D9; /* body */
  --muted:      #9DA1A8; /* captions */
  --faint:      #6f7682; /* disclaimer */
  --alert:      #d98b6a; /* capacity exceeded */

  --hairline:   rgba(215,215,217,0.12);
  --border-in:  rgba(215,215,217,0.18);
  --gold-line:  rgba(230,199,136,0.16);

  --serif: 'Bodoni Moda', Georgia, serif;
  --sans:  'Instrument Sans', system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--black);
  color: var(--gray);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
}

::selection { background: var(--gold); color: var(--black); }

a { color: inherit; }

@keyframes orbita { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.orbit svg { display: block; animation: orbita 30s linear infinite; }

@media (prefers-reduced-motion: reduce) {
  .orbit svg { animation: none; }
  * { scroll-behavior: auto !important; }
}

/* ---------------------------------------------------------------- Eyebrows */
.eyebrow {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 20px;
}
.card > .eyebrow { letter-spacing: 0.18em; margin-bottom: 6px; }

/* ---------------------------------------------------------------- Language */
.lang-switch {
  display: inline-flex;
  padding: 3px;
  background: rgba(215,215,217,0.06);
  border: 1px solid var(--hairline);
  border-radius: 999px;
}
.lang-btn {
  padding: 6px 13px;
  border: none;
  border-radius: 999px;
  cursor: pointer;
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 600;
  background: transparent;
  color: var(--muted);
  transition: background 0.18s ease, color 0.18s ease;
}
.lang-btn.active { background: var(--gold); color: var(--black); }

/* =============================================================== LOGIN ==== */
.login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}
.login-card { width: 100%; max-width: 392px; position: relative; }

.brand-row { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; }
.eyebrow-brand {
  font-size: 11px; font-weight: 700; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--gold);
}
.login-title {
  margin: 0 0 16px;
  font-family: var(--serif);
  font-weight: 800;
  font-size: 34px;
  line-height: 1.12;
  color: var(--cream);
  text-wrap: balance;
}
.login-sub { margin: 0 0 36px; font-size: 15px; line-height: 1.6; color: var(--muted); }

.field { margin-bottom: 18px; }
.field-gap { margin-bottom: 26px; }
.field-label {
  display: block;
  font-size: 11px; font-weight: 600; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 8px;
}
.text-input {
  width: 100%;
  background: var(--navy);
  border: 1px solid var(--border-in);
  border-radius: 8px;
  padding: 14px 16px;
  color: var(--cream);
  font-family: var(--sans);
  font-size: 15px;
  outline: none;
  transition: border-color 0.18s ease;
}
.text-input:focus { border-color: var(--gold); }
.text-input::placeholder { color: #5f6470; }

.btn-primary {
  width: 100%;
  font-family: var(--sans);
  font-size: 16px; font-weight: 600;
  color: var(--black);
  background: var(--gold);
  border: none;
  border-radius: 8px;
  padding: 16px;
  cursor: pointer;
  letter-spacing: 0.01em;
  box-shadow: 0 10px 30px rgba(230,199,136,0.16);
  transition: background 0.18s ease;
}
.btn-primary:hover { background: var(--gold-hover); }

.login-help { margin-top: 18px; text-align: center; }
.link-muted { font-size: 13px; color: var(--muted); text-decoration: none; }
.link-muted:hover { color: var(--gold); }

.login-footer {
  margin-top: 36px; padding-top: 24px;
  border-top: 1px solid rgba(215,215,217,0.1);
  display: flex; align-items: center; justify-content: space-between;
  gap: 14px; flex-wrap: wrap;
}
.alliance { display: inline-flex; align-items: center; gap: 11px; }
.alliance svg { flex-shrink: 0; }
.alliance-label {
  font-size: 9px; font-weight: 600; letter-spacing: 0.2em;
  text-transform: uppercase; color: var(--muted);
}
.alliance-name {
  font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: var(--gold);
}
.demo-note { font-size: 10px; color: var(--faint); letter-spacing: 0.04em; }

.lang-switch-login { margin-top: 28px; }

/* ================================================================= APP ==== */
.app-screen { min-height: 100vh; }
.app-inner { max-width: 1180px; margin: 0 auto; padding: 30px 30px 34px; }

.app-header {
  display: flex; align-items: center; justify-content: space-between;
  gap: 14px; margin-bottom: 20px;
}
.app-brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.orbit { flex-shrink: 0; line-height: 0; }
.app-brand-text { min-width: 0; }
.app-name {
  font-size: 14px; font-weight: 600; color: var(--cream);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.app-sub { font-size: 11px; color: var(--muted); }
.app-header-actions { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }

.btn-logout {
  font-family: var(--sans);
  font-size: 13px; font-weight: 500;
  color: var(--gray);
  background: transparent;
  border: 1px solid rgba(215,215,217,0.2);
  border-radius: 999px;
  padding: 8px 18px;
  cursor: pointer;
  transition: border-color 0.18s ease, color 0.18s ease;
}
.btn-logout:hover { border-color: var(--gold); color: var(--gold); }

/* tabs — only visible on mobile */
.tabs { display: none; padding: 3px; background: rgba(215,215,217,0.06);
  border: 1px solid var(--hairline); border-radius: 999px; margin-bottom: 18px; }
.tab-btn {
  flex: 1; padding: 11px 0; border: none; border-radius: 999px; cursor: pointer;
  font-family: var(--sans); font-size: 13px; font-weight: 600;
  background: transparent; color: var(--muted);
  transition: background 0.18s ease, color 0.18s ease;
}
.tab-btn.active { background: var(--gold); color: var(--black); }

/* layout */
.main-grid { display: grid; grid-template-columns: 340px 1fr; gap: 22px; align-items: start; }
.results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* panels & cards */
.panel {
  background: var(--navy);
  border: 1px solid var(--hairline);
  border-radius: 14px;
  padding: 24px 22px;
}
.card-accent { border-color: rgba(230,199,136,0.32); }
.card-span { grid-column: 1 / -1; }

/* ------------------------------------------------------------- Inputs ----- */
.input-group { margin-bottom: 18px; }
.input-group-tight { margin-bottom: 6px; }
.input-label { display: block; font-size: 13px; color: var(--gray); margin-bottom: 7px; }

.num-wrap { position: relative; }
.num-input {
  width: 100%;
  background: var(--black);
  border: 1px solid var(--border-in);
  border-radius: 8px;
  padding: 12px 54px 12px 14px;
  color: var(--cream);
  font-family: var(--sans);
  font-size: 16px;
  outline: none;
  transition: border-color 0.18s ease;
}
.num-input:focus { border-color: var(--gold); }
.num-input::-webkit-outer-spin-button,
.num-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.num-input { -moz-appearance: textfield; }
.num-suffix {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  font-size: 12px; color: var(--muted); letter-spacing: 0.06em; pointer-events: none;
}

.slider-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; margin-bottom: 9px;
}
.slider-val { font-family: var(--serif); font-size: 16px; font-weight: 700; color: var(--gold); }

/* range */
.rng {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 4px; border-radius: 999px;
  background: var(--border-in); outline: none; cursor: pointer;
}
.rng::-webkit-slider-thumb {
  -webkit-appearance: none; width: 18px; height: 18px; border-radius: 999px;
  background: var(--gold); border: none; cursor: pointer;
  box-shadow: 0 0 0 4px rgba(230,199,136,0.14);
}
.rng::-moz-range-thumb {
  width: 18px; height: 18px; border: none; border-radius: 999px;
  background: var(--gold); cursor: pointer; box-shadow: 0 0 0 4px rgba(230,199,136,0.14);
}
.rng:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 5px rgba(230,199,136,0.3); }

/* segmented controls */
.seg { display: grid; gap: 8px; }
.seg-3 { grid-template-columns: 1fr 1fr 1fr; }
.seg-2x2 { grid-template-columns: 1fr 1fr; }
.seg-btn {
  padding: 11px 0;
  border-radius: 8px;
  cursor: pointer;
  font-family: var(--sans);
  font-size: 14px; font-weight: 600;
  border: 1px solid var(--border-in);
  background: transparent;
  color: var(--gray);
  transition: border-color 0.18s ease, background 0.18s ease, color 0.18s ease;
}
.seg-btn.market { padding: 11px 13px; text-align: left; font-size: 13px; }
.seg-btn.active { border-color: var(--gold); background: rgba(230,199,136,0.12); color: var(--gold); }
.seg-btn .unit { font-weight: 400; opacity: 0.7; font-size: 12px; }

.hairline { height: 1px; background: rgba(215,215,217,0.1); margin: 26px 0; }

/* toggle */
.toggle-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding-top: 16px; border-top: 1px solid rgba(215,215,217,0.1);
}
.toggle-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.switch {
  position: relative; width: 46px; height: 26px; border-radius: 999px;
  border: none; cursor: pointer; flex-shrink: 0;
  background: rgba(215,215,217,0.2);
  transition: background 0.2s ease;
}
.switch.on { background: var(--gold); }
.switch-knob {
  position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
  border-radius: 999px; background: var(--black);
  transition: transform 0.2s ease;
}
.switch.on .switch-knob { transform: translateX(20px); }

/* ------------------------------------------------------------- Cards ------ */
.card-help { margin: 0; font-size: 13px; line-height: 1.5; color: var(--muted); }
.card-help-mb { margin-bottom: 18px; }

.hero-num-row { display: flex; align-items: baseline; gap: 8px; margin: 18px 0 4px; }
.hero-num { font-family: var(--serif); font-weight: 800; font-size: 60px; line-height: 0.9; color: var(--gold); }
.hero-num-unit { font-family: var(--serif); font-weight: 700; font-size: 26px; color: var(--gold); }
.hero-caption { font-size: 13px; color: var(--gray); }

.card-footer { display: flex; gap: 28px; margin-top: 20px; padding-top: 16px; }
.card-footer-2 { border-top: 1px solid var(--hairline); }
.card-accent .card-footer-2 { border-top-color: var(--gold-line); }
.foot-num { font-family: var(--serif); font-weight: 700; font-size: 24px; color: var(--cream); line-height: 1; }
.foot-num-gold { color: var(--gold); }
.foot-num-sm { font-size: 18px; font-weight: 600; color: var(--cream); line-height: 1; }
.foot-unit { font-size: 11px; color: var(--muted); }
.foot-cap { font-size: 11px; color: var(--muted); margin-top: 5px; }
.card-footer-2 .foot-cap { margin-top: 6px; }

.big-num-row { display: flex; align-items: baseline; gap: 7px; margin: 18px 0 3px; }
.big-num { font-family: var(--serif); font-weight: 700; font-size: 40px; color: var(--cream); line-height: 1; }
.big-num-unit { font-size: 13px; color: var(--muted); }
.sub-line { font-size: 12px; color: var(--muted); }

/* usage bar (debt capacity) */
.usage { margin-top: 18px; }
.usage-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.usage-label { font-size: 12px; color: var(--muted); }
.usage-strong { color: var(--gray); }
.usage-pct { font-size: 12px; font-weight: 600; }
.usage-status { margin-top: 9px; font-size: 12px; }

.bar-track { background: var(--hairline); border-radius: 999px; overflow: hidden; }
.bar-track-6 { height: 6px; }
.bar-track-8 { height: 8px; background: rgba(215,215,217,0.1); }
.bar-fill { height: 100%; border-radius: 999px; transition: width 0.3s ease, background 0.2s ease; }
.bar-fill-gold { background: var(--gold); }
.bar-fill-gray { background: rgba(215,215,217,0.38); }

/* taxes */
.tax-bars { margin-top: 18px; display: flex; flex-direction: column; gap: 15px; }
.tax-bar-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 7px; }
.tax-bar-label { font-size: 12px; color: var(--muted); }
.tax-bar-val { font-size: 13px; font-weight: 600; }
.strong-cream { color: var(--cream); }
.strong-gray { color: var(--gray); }
.highlight {
  margin-top: 16px; padding: 11px 14px;
  background: rgba(230,199,136,0.08);
  border-left: 2px solid var(--gold);
  border-radius: 0 8px 8px 0;
}
.highlight-label { font-size: 12px; color: var(--muted); }
.highlight-val { font-size: 13px; font-weight: 700; color: var(--gold); }

/* projection */
.proj-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.proj-end { text-align: right; }
.proj-end-num { font-family: var(--serif); font-weight: 700; font-size: 22px; color: var(--gold); line-height: 1; }
.chart-wrap { margin-top: 18px; }
#chart { display: block; height: auto; overflow: visible; }
.chart-axis { display: flex; justify-content: space-between; margin-top: 8px; }
.chart-axis span { font-size: 11px; color: var(--muted); }

/* market comparison */
.market-list { display: flex; flex-direction: column; gap: 16px; }
.market-row-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 7px; }
.market-name { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
.market-dot { width: 6px; height: 6px; border-radius: 999px; flex-shrink: 0; }
.market-tir { font-family: var(--serif); font-size: 16px; font-weight: 700; color: var(--cream); }
.market-fx { font-size: 10px; font-weight: 600; letter-spacing: 0.03em; color: var(--alert); }
.market-fx-note { margin-top: 16px; }

/* IRR verdict badge (Cap. 9 benchmarks) */
.verdict {
  display: inline-flex; align-items: center; gap: 7px;
  margin-top: 14px; padding: 6px 12px; border-radius: 999px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
  color: var(--gold);
  border: 1px solid rgba(230,199,136,0.32);
  background: rgba(230,199,136,0.08);
}
.verdict::before { content: ''; width: 6px; height: 6px; border-radius: 999px; background: currentColor; }
.verdict.mid  { color: var(--cream); border-color: var(--hairline); background: rgba(215,215,217,0.06); }
.verdict.warn { color: var(--alert); border-color: rgba(217,139,106,0.4); background: rgba(217,139,106,0.08); }

/* valuation scenarios */
.scen-list { display: flex; flex-direction: column; gap: 16px; }
.scen-verdict {
  margin-top: 16px; padding: 11px 14px;
  border-left: 2px solid var(--gold); border-radius: 0 8px 8px 0;
  background: rgba(230,199,136,0.08);
  font-size: 12px; line-height: 1.5; color: var(--gray);
}
.scen-verdict.warn { border-left-color: var(--alert); background: rgba(217,139,106,0.08); }

/* disclaimer */
.disclaimer { margin: 20px 0 0; font-size: 11px; line-height: 1.6; color: var(--faint); text-align: center; }

/* focus visibility — gold ring, never a harsh white outline */
:focus-visible { outline: none; }
.btn-primary:focus-visible,
.btn-logout:focus-visible,
.seg-btn:focus-visible,
.lang-btn:focus-visible,
.tab-btn:focus-visible,
.switch:focus-visible,
.text-input:focus-visible,
.num-input:focus-visible {
  box-shadow: 0 0 0 3px rgba(230,199,136,0.35);
}

/* ============================================================ RESPONSIVE == */
@media (max-width: 899px) {
  .app-inner { padding: 22px 16px 26px; }
  .main-grid { display: block; }
  .results-grid { display: flex; flex-direction: column; gap: 14px; }
  .tabs { display: flex; }
  .inputs-panel { margin-bottom: 0; }

  /* tab visibility toggled by JS on <main> */
  .app-screen[data-tab="datos"] .results-grid { display: none; }
  .app-screen[data-tab="resultados"] .inputs-panel { display: none; }

  .hero-num { font-size: 52px; }
  .login-title { font-size: 30px; }
}

      modNse: 'Economic Security Number', modNseHelp: 'The monthly income that sets you free, inflation-adjusted.',
      nseObjetivo: 'Target monthly income', nseCapital: 'Capital that generates it (×1.25 margin)', nseCiclos: 'Cycles like this to get there',
      modProyeccion: 'Your capital projection', modProyeccionHelp: 'Value of your equity year by year.', proyEnd: 'Capital at the end',

      scenCons: 'Conservative', scenBase: 'Base', scenOpt: 'Optimistic',

  /* Núcleo de mercados del método (Cap. 4/45/47). `g` = valorización anual
     esperada (ilustrativa, dentro de los rangos del libro); `fx` = expuesto a
     riesgo cambiario (moneda local, no USD). Dubái en AED anclado al USD;
     RD/México costero/Panamá/Costa Rica operan en USD. */
  var MARKETS = [
    { id: 'colombia',  g: 9,  fx: true,  name: { es: 'Colombia',        en: 'Colombia' } },
    { id: 'rd',        g: 10, fx: false, name: { es: 'Rep. Dominicana', en: 'Dominican Rep.' } },
    { id: 'mexico',    g: 8,  fx: false, name: { es: 'México',          en: 'Mexico' } },
    { id: 'dubai',     g: 15, fx: false, name: { es: 'Dubái',           en: 'Dubai' } },
    { id: 'panama',    g: 7,  fx: false, name: { es: 'Panamá',          en: 'Panama' } },
    { id: 'costarica', g: 12, fx: false, name: { es: 'Costa Rica',      en: 'Costa Rica' } }
  ];

  /* ----------------------------------------------------------- state ------ */
  var state = {
    lang: 'es',
    screen: 'login',      // 'login' | 'app'
    mobileTab: 'datos',   // 'datos' | 'resultados'
    ingreso: 6000, gasto: 2800, capital: 35000, horizonte: 10,
    valor: 120000, inicialPct: 30, planMeses: 36, valorizacion: 8,
    mercado: 'colombia', taxRate: 30, diferimiento: true
  };

  var $  = function (id) { return document.getElementById(id); };
  var mqMobile = window.matchMedia('(max-width: 899px)');

  /* --------------------------------------------------------- formatting --- */
  function makeFmt(lang) {
    var locale = lang === 'es' ? 'de-DE' : 'en-US';
    return {
      fmt: function (n) { return Math.round(n).toLocaleString(locale); },
      pct: function (f, d) { var v = (f * 100).toFixed(d == null ? 1 : d); return lang === 'es' ? v.replace('.', ',') : v; },
      dec: function (n, d) { var v = n.toFixed(d == null ? 1 : d); return lang === 'es' ? v.replace('.', ',') : v; }
    };
  }

  /* -------------------------------------------------- calculation engine -- */
  function compute() {
    var s = state, L = T[s.lang];
    var f = makeFmt(s.lang);

    var I = s.ingreso, G = s.gasto, H = s.horizonte;
    var V = s.valor, d = s.inicialPct / 100, m = s.planMeses, g = s.valorizacion / 100;

    // debt capacity
    var excedente = I - G;
    var limiteSano = 0.35 * I;
    var capacidadMensual = Math.max(0, Math.min(excedente, limiteSano));
    var cuotaInicialTotal = V * d;
    var cuotaMensual = cuotaInicialTotal / m;
    var pctUsado = capacidadMensual > 0 ? cuotaMensual / capacidadMensual : 2;
    var capEstado, capColor;
    if (pctUsado <= 0.85) { capEstado = L.capEstadoSano; capColor = '#E6C788'; }
    else if (pctUsado <= 1) { capEstado = L.capEstadoAjustado; capColor = '#E6C788'; }
    else { capEstado = L.capEstadoExcede; capColor = '#d98b6a'; }

    // IRR with leverage
    var equityInicial = cuotaInicialTotal;
    var valorFuturo = V * Math.pow(1 + g, H);
    var equityFinal = valorFuturo - V * (1 - d);
    var multiple = equityInicial > 0 ? equityFinal / equityInicial : 0;
    var tirApalancada = multiple > 0 ? Math.pow(multiple, 1 / H) - 1 : 0;
    var tirSin = g;
    var gananciaTotal = equityFinal - equityInicial;

    // taxes
    var taxFull = s.taxRate / 100;
    var impuesto = Math.max(0, gananciaTotal) * taxFull;
    var reinvNeto = equityFinal - impuesto;
    var reinvDiferido = equityFinal;
    var ventaja = impuesto;
    var maxReinv = Math.max(reinvDiferido, 1);

    // NSE — método del libro (Cap. 7): se proyecta el gasto al horizonte por
    // inflación, se divide por la rentabilidad conservadora del portafolio
    // (1% mensual ≈ 12% anual) y se aplica el margen de seguridad ×1,25.
    var inflacion = 0.03;        // 3% anual (USD/EUR)
    var rendMensual = 0.01;      // 1% mensual
    var margenSeg = 1.25;
    var gastoProyectado = G * Math.pow(1 + inflacion, H);
    var nseMensual = gastoProyectado;                       // ingreso mensual objetivo, proyectado
    var capitalLibertad = (gastoProyectado / rendMensual) * margenSeg;
    var gananciaPorCiclo = Math.max(gananciaTotal, 1);
    var ciclos = Math.max(1, Math.ceil(capitalLibertad / gananciaPorCiclo));

    // chart
    var Wsvg = 600, Hsvg = 230, padL = 6, padR = 6, padT = 16, padB = 8;
    var eq = function (t) { return V * Math.pow(1 + g, t) - V * (1 - d); };
    var vals = []; for (var t = 0; t <= H; t++) vals.push(eq(t));
    var yMax = Math.max.apply(null, vals), yMin = 0;
    var X = function (t) { return padL + (t / H) * (Wsvg - padL - padR); };
    var Y = function (v) { return Hsvg - padB - ((v - yMin) / (yMax - yMin || 1)) * (Hsvg - padT - padB); };
    var pts = '', areaMid = '';
    for (var t2 = 0; t2 <= H; t2++) { var seg = X(t2) + ',' + Y(vals[t2]); pts += (t2 ? ' ' : '') + seg; areaMid += (t2 ? ' L ' : '') + seg; }
    var chartArea = 'M ' + X(0) + ',' + (Hsvg - padB) + ' L ' + areaMid + ' L ' + X(H) + ',' + (Hsvg - padB) + ' Z';
    var mids = [0, Math.round(H / 2), H].filter(function (v, i, a) { return a.indexOf(v) === i; });
    var axisYears = mids.map(function (t) { return L.yr + ' ' + t; });

    // markets
    var tirFor = function (gg) {
      var vf = V * Math.pow(1 + gg / 100, H);
      var ef = vf - V * (1 - d);
      var mu = equityInicial > 0 ? ef / equityInicial : 0;
      return mu > 0 ? Math.pow(mu, 1 / H) - 1 : 0;
    };
    var computed = MARKETS.map(function (mk) { return { id: mk.id, g: mk.g, fx: mk.fx, name: mk.name[s.lang], tir: tirFor(mk.g) }; });
    var maxTir = Math.max.apply(null, computed.map(function (x) { return x.tir; }).concat([0.0001]));

    // valuation scenarios (Cap. 9) — conservative / base / optimistic, anchored
    // on the user's rate with the book's 15/25/35 ratio (base = the user's g).
    var scenDefs = [
      { key: 'cons', label: L.scenCons, g: g * 0.6 },
      { key: 'base', label: L.scenBase, g: g },
      { key: 'opt',  label: L.scenOpt,  g: g * 1.4 }
    ];
    var scenarios = scenDefs.map(function (sc) { return { key: sc.key, label: sc.label, g: sc.g, tir: tirFor(sc.g * 100) }; });
    var maxScenTir = Math.max.apply(null, scenarios.map(function (x) { return x.tir; }).concat([0.0001]));
    var reglaOro = scenarios[0].tir >= 0.15;   // conservative case clears 15% → Regla de Oro

    // IRR verdict (Cap. 9 benchmarks)
    var verdict;
    if (tirApalancada >= 0.35)      verdict = { text: L.verdictAlpha,    cls: '' };
    else if (tirApalancada >= 0.20) verdict = { text: L.verdictStandard, cls: '' };
    else if (tirApalancada >= 0.12) verdict = { text: L.verdictMarket,   cls: 'mid' };
    else                            verdict = { text: L.verdictAlert,    cls: 'warn' };

    return {
      f: f, L: L,
      capacidadMensual: capacidadMensual, cuotaMensual: cuotaMensual,
      pctUsado: pctUsado, capEstado: capEstado, capColor: capColor,
      tirApalancada: tirApalancada, tirSin: tirSin, multiple: multiple,
      reinvNeto: reinvNeto, reinvDiferido: reinvDiferido, ventaja: ventaja, maxReinv: maxReinv,
      nseMensual: nseMensual, capitalLibertad: capitalLibertad, ciclos: ciclos,
      chartPts: pts, chartArea: chartArea, axisYears: axisYears,
      chartStart: { x: X(0), y: Y(vals[0]) }, chartEnd: { x: X(H), y: Y(vals[H]) },
      endVal: vals[H],
      markets: computed, maxTir: maxTir,
      scenarios: scenarios, maxScenTir: maxScenTir, reglaOro: reglaOro,
      verdict: verdict
    };
  }

  /* --------------------------------------------------------- rendering ---- */
  function setText(id, v) { var el = $(id); if (el) el.textContent = v; }

  function renderStaticText() {
    var L = T[state.lang];
    document.documentElement.lang = state.lang;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++) {
      var key = nodes[i].getAttribute('data-i18n');
      if (L[key] != null) nodes[i].textContent = L[key];
    }
    // language switch active states
    var langBtns = document.querySelectorAll('.lang-btn');
    for (var j = 0; j < langBtns.length; j++) {
      langBtns[j].classList.toggle('active', langBtns[j].getAttribute('data-lang') === state.lang);
    }
  }

  function buildSegments() {
    var L = T[state.lang], f = makeFmt(state.lang);

    // horizon 5 / 10 / 15
    var segH = $('seg-horizonte');
    segH.innerHTML = '';
    [5, 10, 15].forEach(function (v) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'seg-btn' + (state.horizonte === v ? ' active' : '');
      b.innerHTML = String(v) + '<span class="unit"> ' + L.unitYears + '</span>';
      b.addEventListener('click', function () { state.horizonte = v; render(); });
      segH.appendChild(b);
    });

    // markets 2x2
    var segM = $('seg-mercado');
    segM.innerHTML = '';
    MARKETS.forEach(function (mk) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'seg-btn market' + (state.mercado === mk.id ? ' active' : '');
      b.textContent = mk.name[state.lang];
      b.addEventListener('click', function () {
        state.mercado = mk.id;
        state.valorizacion = mk.g; // selecting a market presets its appreciation
        render();
      });
      segM.appendChild(b);
    });
  }

  function render() {
    var s = state, c = compute(), f = c.f, L = c.L;

    // screens
    $('login').hidden = s.screen !== 'login';
    $('app').hidden = s.screen !== 'app';

    renderStaticText();
    if (s.screen !== 'app') return;

    // mobile tab data-attr (CSS uses it to show/hide panels)
    $('app').setAttribute('data-tab', mqMobile.matches ? s.mobileTab : 'all');
    var tabBtns = document.querySelectorAll('.tab-btn');
    for (var i = 0; i < tabBtns.length; i++) {
      tabBtns[i].classList.toggle('active', tabBtns[i].getAttribute('data-tab') === s.mobileTab);
    }

    // rebuild segmented controls (labels depend on lang, active on state)
    buildSegments();

    // number inputs — don't stomp the field the user is editing
    setNumIfIdle('in-ingreso', s.ingreso);
    setNumIfIdle('in-gasto', s.gasto);
    setNumIfIdle('in-capital', s.capital);
    setNumIfIdle('in-valor', s.valor);

    // sliders + readouts
    $('in-inicial').value = s.inicialPct;
    $('in-plan').value = s.planMeses;
    $('in-valoriz').value = s.valorizacion;
    $('in-tax').value = s.taxRate;
    setText('val-inicial', f.dec(s.inicialPct, 0) + '%');
    setText('val-plan', s.planMeses + ' ' + L.unitMonths);
    setText('val-valoriz', f.dec(s.valorizacion, 1) + '%');
    setText('val-tax', f.dec(s.taxRate, 0) + '%');

    // deferral toggle
    var sw = $('dif-toggle');
    sw.classList.toggle('on', s.diferimiento);
    sw.setAttribute('aria-checked', s.diferimiento ? 'true' : 'false');
    setText('dif-label', s.diferimiento ? L.difOn : L.difOff);

    // IRR card + verdict (Cap. 9 benchmarks)
    setText('tir-ap', f.pct(c.tirApalancada));
    setText('tir-sin', f.pct(c.tirSin));
    setText('tir-multiple', f.dec(c.multiple, 1) + '×');
    var verdictEl = $('tir-verdict');
    verdictEl.textContent = c.verdict.text;
    verdictEl.className = 'verdict' + (c.verdict.cls ? ' ' + c.verdict.cls : '');

    // debt capacity
    setText('cap-mensual', f.fmt(c.capacidadMensual));
    setText('cap-cuota', f.fmt(c.cuotaMensual) + ' ' + L.perMonth);
    var pctText = f.pct(Math.min(c.pctUsado, 3), 0);
    setText('cap-pct-top', pctText + '%');
    $('cap-pct-top').style.color = c.capColor;
    var bar = $('cap-bar');
    bar.style.width = Math.min(c.pctUsado * 100, 100) + '%';
    bar.style.background = c.capColor;
    var status = $('cap-status');
    status.textContent = c.capEstado + ' · ' + pctText + '% ' + L.capPctUsado;
    status.style.color = c.capColor;

    // taxes
    setText('tax-diferido', f.fmt(c.reinvDiferido) + ' USD');
    setText('tax-neto', f.fmt(c.reinvNeto) + ' USD');
    setText('tax-ventaja', f.fmt(c.ventaja) + ' USD');
    $('tax-bar-diferido').style.width = (c.reinvDiferido / c.maxReinv * 100) + '%';
    $('tax-bar-neto').style.width = (c.reinvNeto / c.maxReinv * 100) + '%';

    // NSE
    setText('nse-mensual', f.fmt(c.nseMensual));
    setText('nse-capital', f.fmt(c.capitalLibertad));
    setText('nse-ciclos', c.ciclos);

    // projection chart
    $('chart-line').setAttribute('points', c.chartPts);
    $('chart-area').setAttribute('d', c.chartArea);
    $('chart-start').setAttribute('cx', c.chartStart.x);
    $('chart-start').setAttribute('cy', c.chartStart.y);
    $('chart-end').setAttribute('cx', c.chartEnd.x);
    $('chart-end').setAttribute('cy', c.chartEnd.y);
    setText('proj-end', f.fmt(c.endVal));
    var axis = $('chart-axis');
    axis.innerHTML = '';
    c.axisYears.forEach(function (label) {
      var span = document.createElement('span');
      span.textContent = label;
      axis.appendChild(span);
    });

    // valuation scenarios (Cap. 9) + Regla de Oro verdict
    var scenList = $('scen-list');
    scenList.innerHTML = '';
    c.scenarios.forEach(function (sc) {
      var isBase = sc.key === 'base';
      var barColor = isBase ? '#E6C788' : 'rgba(230,199,136,0.4)';
      var row = document.createElement('div');
      row.className = 'scen-row';
      row.innerHTML =
        '<div class="market-row-head">' +
          '<span class="market-name" style="color:' + (isBase ? '#E6C788' : '#D7D7D9') + '">' +
            '<span class="market-dot" style="background:' + barColor + '"></span>' +
            escapeHtml(sc.label) + ' · ' + f.pct(sc.g, 1) + '%' +
          '</span>' +
          '<span class="market-tir">' + f.pct(sc.tir) + '%</span>' +
        '</div>' +
        '<div class="bar-track bar-track-8">' +
          '<div class="bar-fill" style="width:' + (sc.tir / c.maxScenTir * 100) + '%;background:' + barColor + '"></div>' +
        '</div>';
      scenList.appendChild(row);
    });
    var scenV = $('scen-verdict');
    scenV.textContent = c.reglaOro ? L.reglaOroOk : L.reglaOroNo;
    scenV.className = 'scen-verdict' + (c.reglaOro ? '' : ' warn');

    // market comparison
    var list = $('market-list');
    list.innerHTML = '';
    c.markets.forEach(function (mk) {
      var active = mk.id === s.mercado;
      var barColor = active ? '#E6C788' : 'rgba(230,199,136,0.4)';
      var fxTag = mk.fx ? '<span class="market-fx"> · ' + escapeHtml(L.fxRisk) + '</span>' : '';
      var row = document.createElement('div');
      row.innerHTML =
        '<div class="market-row-head">' +
          '<span class="market-name" style="color:' + (active ? '#E6C788' : '#D7D7D9') + '">' +
            '<span class="market-dot" style="background:' + barColor + '"></span>' + escapeHtml(mk.name) + fxTag +
          '</span>' +
          '<span class="market-tir">' + f.pct(mk.tir) + '%</span>' +
        '</div>' +
        '<div class="bar-track bar-track-8">' +
          '<div class="bar-fill" style="width:' + (mk.tir / c.maxTir * 100) + '%;background:' + barColor + '"></div>' +
        '</div>';
      list.appendChild(row);
    });
  }

  function setNumIfIdle(id, value) {
    var el = $(id);
    if (el && document.activeElement !== el) el.value = value;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  /* ----------------------------------------------------------- wiring ----- */
  function parseNum(raw) {
    var v = parseFloat(String(raw).replace(/[^0-9.]/g, ''));
    return isNaN(v) ? 0 : v;
  }

  function init() {
    // number inputs — live on input
    [['in-ingreso', 'ingreso'], ['in-gasto', 'gasto'], ['in-capital', 'capital'], ['in-valor', 'valor']]
      .forEach(function (pair) {
        $(pair[0]).addEventListener('input', function (e) { state[pair[1]] = parseNum(e.target.value); render(); });
      });

    // sliders — live on input
    [['in-inicial', 'inicialPct'], ['in-plan', 'planMeses'], ['in-valoriz', 'valorizacion'], ['in-tax', 'taxRate']]
      .forEach(function (pair) {
        $(pair[0]).addEventListener('input', function (e) { state[pair[1]] = parseFloat(e.target.value); render(); });
      });

    // deferral toggle
    $('dif-toggle').addEventListener('click', function () { state.diferimiento = !state.diferimiento; render(); });

    // language switch (any of the two switches)
    document.querySelectorAll('.lang-btn').forEach(function (b) {
      b.addEventListener('click', function () { state.lang = b.getAttribute('data-lang'); render(); });
    });

    // mobile tabs
    document.querySelectorAll('.tab-btn').forEach(function (b) {
      b.addEventListener('click', function () { state.mobileTab = b.getAttribute('data-tab'); render(); });
    });

    // login / logout (any input logs in — demo behavior per the handoff).
    // Wire BOTH the form submit (Enter key) and a direct button click: some
    // sandboxed embeds (preview iframes) block native form submission, so a
    // type=submit button alone would appear unresponsive. doLogin is idempotent.
    function doLogin(e) { if (e) e.preventDefault(); state.screen = 'app'; render(); window.scrollTo(0, 0); }
    $('login-form').addEventListener('submit', doLogin);
    $('login-btn').addEventListener('click', doLogin);
    $('logout-btn').addEventListener('click', function () { state.screen = 'login'; render(); window.scrollTo(0, 0); });

    // re-render on breakpoint changes so panel visibility stays correct
    if (mqMobile.addEventListener) mqMobile.addEventListener('change', render);
    else if (mqMobile.addListener) mqMobile.addListener(render);

    render();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
</body>
</html>
