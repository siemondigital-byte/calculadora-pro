<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora de Viabilidad Inmobiliaria Pro</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230A0A0C'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23E6C788' stroke-width='2' stroke-dasharray='50 14' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='6' r='2.2' fill='%23E6C788'/%3E%3C/svg%3E">
  <!-- PWA (100% instalable) · marca Ciclo de Riqueza (órbita) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0A0A0C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Viabilidad Pro">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- ============================================================= LOGIN -->
  <section id="login" class="login-screen">
    <div class="login-card">
      <div class="brand-row">
        <span class="orbit orbit-36" aria-hidden="true">
          <svg viewBox="0 0 36 36" width="36" height="36">
            <circle cx="18" cy="18" r="15" fill="none" stroke="#E6C788" stroke-width="1.5" stroke-dasharray="74 20" stroke-linecap="round"></circle>
            <circle cx="18" cy="3" r="2.4" fill="#E6C788"></circle>
          </svg>
        </span>
        <span class="eyebrow eyebrow-brand" data-i18n="loginEyebrow"></span>
      </div>
      <h1 class="login-title" data-i18n="loginTitle"></h1>
      <p class="login-sub" data-i18n="loginSub"></p>

      <form id="login-form" novalidate>
        <div class="field">
          <label class="field-label" for="login-email" data-i18n="emailLabel"></label>
          <input id="login-email" class="text-input" type="email" value="" placeholder="tu@correo.com" autocomplete="username">
        </div>
        <div class="field field-gap">
          <label class="field-label" for="login-pw" data-i18n="pwLabel"></label>
          <input id="login-pw" class="text-input" type="password" value="" placeholder="••••••••••••" autocomplete="current-password">
        </div>
        <button type="submit" id="login-btn" class="btn-primary" data-i18n="loginBtn"></button>
      </form>
      <p class="login-error" id="login-error" hidden></p>

      <div class="login-help">
        <a href="#" class="link-muted" data-i18n="loginHelp"></a>
      </div>

      <div class="login-footer">
        <div class="alliance">
          <svg viewBox="0 0 28 28" width="28" height="28" aria-hidden="true">
            <circle cx="14" cy="14" r="11.5" fill="none" stroke="#E6C788" stroke-width="1.1" stroke-dasharray="58 14" stroke-linecap="round"></circle>
            <circle cx="14" cy="2.5" r="1.7" fill="#E6C788"></circle>
          </svg>
          <div>
            <div class="alliance-label" data-i18n="allianceLabel"></div>
            <div class="alliance-name">ATLANTIS GLOBAL REALTY</div>
          </div>
        </div>
      </div>

      <div class="lang-switch lang-switch-login" role="group" aria-label="Language">
        <button type="button" class="lang-btn" data-lang="es">ES</button>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
      </div>
    </div>

    <!-- Vista dedicada de recuperacion (misma tarjeta, distinto contenido) -->
    <div class="login-card" id="forgot-card" hidden>
      <div class="brand-row">
        <span class="orbit orbit-36" aria-hidden="true">
          <svg viewBox="0 0 36 36" width="36" height="36">
            <circle cx="18" cy="18" r="15" fill="none" stroke="#E6C788" stroke-width="1.5" stroke-dasharray="74 20" stroke-linecap="round"></circle>
            <circle cx="18" cy="3" r="2.4" fill="#E6C788"></circle>
          </svg>
        </span>
        <span class="eyebrow eyebrow-brand" data-i18n="forgotEyebrow"></span>
      </div>
      <h1 class="login-title" id="forgot-title" data-i18n="forgotTitle"></h1>
      <p class="login-sub" id="forgot-sub" data-i18n="forgotSub"></p>

      <form id="forgot-form" novalidate>
        <div class="field">
          <label class="field-label" for="forgot-email" data-i18n="emailLabel"></label>
          <input id="forgot-email" class="text-input" type="email" autocomplete="email">
        </div>
        <button type="submit" id="forgot-btn" class="btn-primary" data-i18n="forgotBtn"></button>
      </form>
      <p class="login-error" id="forgot-msg" hidden></p>

      <div class="login-help">
        <a href="#" id="forgot-back" class="link-muted" data-i18n="forgotBack"></a>
      </div>
    </div>
  </section>

  <!-- ============================================================= APP -->
  <main id="app" class="app-screen" hidden>
    <div class="app-inner">

      <!-- header -->
      <header class="app-header">
        <div class="app-brand">
          <span class="orbit orbit-30" aria-hidden="true">
            <svg viewBox="0 0 30 30" width="30" height="30">
              <circle cx="15" cy="15" r="12.5" fill="none" stroke="#E6C788" stroke-width="1.4" stroke-dasharray="62 16" stroke-linecap="round"></circle>
              <circle cx="15" cy="2.5" r="2" fill="#E6C788"></circle>
            </svg>
          </span>
          <div class="app-brand-text">
            <div class="app-name" data-i18n="appName"></div>
            <div class="app-sub" data-i18n="headerSub"></div>
          </div>
        </div>
        <div class="app-header-actions">
          <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" class="lang-btn" data-lang="es">ES</button>
            <button type="button" class="lang-btn" data-lang="en">EN</button>
          </div>
          <button type="button" id="logout-btn" class="btn-logout" data-i18n="logout"></button>
        </div>
      </header>

      <!-- primary navigation -->
      <nav class="app-nav" role="tablist">
        <button type="button" class="nav-btn" data-view="panel" data-i18n="navPanel" role="tab"></button>
        <button type="button" class="nav-btn" data-view="proyecto" data-i18n="navProyecto" role="tab"></button>
      </nav>

      <!-- ============================ PANEL (dashboard) ============================ -->
      <div id="view-panel">
        <!-- sub-navegación: una sección por pestaña -->
        <nav class="pn-subnav" role="tablist">
          <button type="button" class="pn-subtab" data-ptab="info" data-i18n="pnTabInfo" role="tab"></button>
          <button type="button" class="pn-subtab" data-ptab="resumen" data-i18n="pnTabResumen" role="tab"></button>
          <button type="button" class="pn-subtab" data-ptab="proyeccion" data-i18n="pnTabProy" role="tab"></button>
          <button type="button" class="pn-subtab" data-ptab="endeuda" data-i18n="pnTabDeuda" role="tab"></button>
          <button type="button" class="pn-subtab" data-ptab="liquidez" data-i18n="pnTabLiquidez" role="tab"></button>
          <button type="button" class="pn-subtab" data-ptab="proyectos" data-i18n="pnTabProys" role="tab"></button>
          <button type="button" class="pn-subtab" data-ptab="fiscal" data-i18n="pnTabFiscal" role="tab"></button>
          <button type="button" class="pn-subtab" data-ptab="conclusiones" data-i18n="pnTabConcl" role="tab"></button>
        </nav>
        <!-- Your information — módulo propio, separado del resumen -->
        <div class="panel pn-perfil" id="pn-section-info">
          <div class="eyebrow eyebrow-tight" data-i18n="pnPerfil"></div>
          <p class="sec-note" data-i18n="pnPerfilNota"></p>
          <div class="pn-perfil-grid">
            <div class="input-group">
              <span class="input-label" data-i18n="pnNombre"></span>
              <input class="num-input plain" id="pn-nombre" type="text" autocomplete="name">
            </div>
            <div class="input-group">
              <span class="input-label" data-i18n="lblIngreso"></span>
              <div class="num-wrap"><input class="num-input" id="pn-ingreso" type="number" step="100" inputmode="numeric"><span class="num-suffix">USD</span></div>
            </div>
            <div class="input-group">
              <span class="input-label" data-i18n="lblGasto"></span>
              <div class="num-wrap"><input class="num-input" id="pn-gasto" type="number" step="100" inputmode="numeric"><span class="num-suffix">USD</span></div>
            </div>
            <div class="input-group">
              <span class="input-label" data-i18n="lblDeudas"></span>
              <div class="num-wrap"><input class="num-input" id="pn-deudas" type="number" step="50" inputmode="numeric"><span class="num-suffix">USD</span></div>
            </div>
            <div class="input-group">
              <span class="input-label" data-i18n="lblCapital"></span>
              <div class="num-wrap"><input class="num-input" id="pn-capital" type="number" step="500" inputmode="numeric"><span class="num-suffix">USD</span></div>
            </div>
            <div class="input-group">
              <span class="input-label" data-i18n="pnLibertad"></span>
              <div class="num-wrap"><input class="num-input" id="pn-libertad" type="number" step="100" inputmode="numeric"><span class="num-suffix">USD</span></div>
            </div>
            <div class="input-group">
              <div class="slider-head"><span class="input-label" data-i18n="pnValoriz"></span><span class="slider-val" id="pn-val-valoriz"></span></div>
              <input class="rng" id="pn-valoriz" type="range" min="3" max="40" step="0.5">
            </div>
            <div class="input-group">
              <div class="slider-head"><span class="input-label" data-i18n="pnRendRenta"></span><span class="slider-val" id="pn-val-rendrenta"></span></div>
              <input class="rng" id="pn-rendrenta" type="range" min="3" max="12" step="0.5">
            </div>
            <div class="input-group">
              <div class="slider-head"><span class="input-label" data-i18n="lblInflacion"></span><span class="slider-val" id="pn-val-inflacion"></span></div>
              <input class="rng" id="pn-inflacion" type="range" min="2" max="10" step="0.5">
            </div>
            <div class="input-group input-group-tight">
              <span class="input-label" data-i18n="lblHorizonte"></span>
              <div class="seg seg-3" id="pn-seg-horizonte"></div>
            </div>
          </div>
          <div class="pn-datos">
            <div class="eyebrow eyebrow-tight" data-i18n="pnDatos"></div>
            <div class="pn-datos-btns">
              <button type="button" class="pn-cta pn-cta-sm" id="pn-export" data-i18n="pnExportar"></button>
              <button type="button" class="pn-cta pn-cta-sm" id="pn-import-btn" data-i18n="pnImportar"></button>
              <input type="file" id="pn-import-file" accept="application/json,.json" hidden>
            </div>
            <p class="sec-note" id="pn-import-msg"></p>
          </div>
        </div>
        <div class="results-grid" id="panel-results"></div>
      </div>

      <!-- ============================ PROJECT ============================ -->
      <div id="view-proyecto">
      <!-- sub-navegación de proyectos -->
      <nav class="pn-subnav proj-subnav" role="tablist">
        <button type="button" class="pn-subtab proj-subtab" data-ptab="analizar" data-i18n="projTabAnalizar" role="tab"></button>
        <button type="button" class="pn-subtab proj-subtab" data-ptab="comparar" data-i18n="projTabComparar" role="tab"></button>
        <button type="button" class="pn-subtab proj-subtab" data-ptab="portafolio" data-i18n="projTabPortafolio" role="tab"></button>
        <button type="button" class="pn-subtab proj-subtab" data-ptab="checklist" data-i18n="projTabChecklist" role="tab"></button>
      </nav>

      <div id="proj-comparar"></div>
      <div id="proj-portafolio"></div>
      <div id="proj-checklist"></div>

      <div id="proj-analizar">
      <!-- projects bar -->
      <div class="projects-row">
        <span class="projects-label" data-i18n="projectsTitle"></span>
        <div class="projects-bar" id="projects-bar"></div>
      </div>

      <!-- mobile tab control -->
      <div class="tabs" role="tablist">
        <button type="button" class="tab-btn" data-tab="datos" data-i18n="tabDatos" role="tab"></button>
        <button type="button" class="tab-btn" data-tab="resultados" data-i18n="tabResultados" role="tab"></button>
      </div>

      <div class="main-grid">

        <!-- ============================ INPUTS ============================ -->
        <div class="inputs-panel panel">

          <!-- project identity -->
          <div class="sec-head">
            <div class="eyebrow eyebrow-tight" data-i18n="secProyecto"></div>
            <button type="button" id="del-project" class="link-del" data-i18n="deleteProject"></button>
          </div>
          <div class="input-group">
            <span class="input-label" data-i18n="lblProyNombre"></span>
            <input class="num-input plain" id="in-nombre" type="text" autocomplete="off">
          </div>
          <div class="input-row-2">
            <div class="input-group">
              <span class="input-label" data-i18n="lblUbicacion"></span>
              <input class="num-input plain" id="in-ubicacion" type="text" autocomplete="off">
            </div>
            <div class="input-group input-group-moneda">
              <span class="input-label" data-i18n="lblMoneda"></span>
              <input class="num-input plain" id="in-moneda" type="text" autocomplete="off" maxlength="4">
            </div>
          </div>
          <div class="input-group" id="grp-devaluacion">
            <div class="slider-head"><span class="input-label" data-i18n="lblDevaluacion"></span><span class="slider-val" id="val-devaluacion"></span></div>
            <input class="rng" id="in-devaluacion" type="range" min="0" max="20" step="1">
          </div>

          <div class="hairline"></div>

          <!-- your situation (shared) -->
          <div class="eyebrow" data-i18n="secSituacion"></div>
          <p class="sec-note" data-i18n="situacionNota"></p>

          <div class="input-group">
            <span class="input-label" data-i18n="lblIngreso"></span>
            <div class="num-wrap"><input class="num-input" id="in-ingreso" type="number" step="100" inputmode="numeric"><span class="num-suffix">USD</span></div>
          </div>
          <div class="input-group">
            <span class="input-label" data-i18n="lblGasto"></span>
            <div class="num-wrap"><input class="num-input" id="in-gasto" type="number" step="100" inputmode="numeric"><span class="num-suffix">USD</span></div>
          </div>
          <div class="input-group">
            <span class="input-label" data-i18n="lblDeudas"></span>
            <div class="num-wrap"><input class="num-input" id="in-deudas" type="number" step="50" inputmode="numeric"><span class="num-suffix">USD</span></div>
          </div>
          <div class="input-group">
            <span class="input-label" data-i18n="lblCapital"></span>
            <div class="num-wrap"><input class="num-input" id="in-capital" type="number" step="500" inputmode="numeric"><span class="num-suffix">USD</span></div>
          </div>
          <div class="input-group">
            <div class="slider-head"><span class="input-label" data-i18n="lblInflacion"></span><span class="slider-val" id="val-inflacion"></span></div>
            <input class="rng" id="in-inflacion" type="range" min="2" max="10" step="0.5">
          </div>
          <div class="input-group input-group-tight">
            <span class="input-label" data-i18n="lblHorizonte"></span>
            <div class="seg seg-3" id="seg-horizonte"></div>
          </div>

          <div class="hairline"></div>

          <!-- the opportunity -->
          <div class="eyebrow" data-i18n="secOportunidad"></div>
          <div class="input-group">
            <span class="input-label" data-i18n="lblValor"></span>
            <div class="num-wrap"><input class="num-input" id="in-valor" type="number" step="5000" inputmode="numeric"><span class="num-suffix">USD</span></div>
          </div>
          <div class="input-group">
            <div class="slider-head"><span class="input-label" data-i18n="lblInicial"></span><span class="slider-val" id="val-inicial"></span></div>
            <input class="rng" id="in-inicial" type="range" min="10" max="50" step="1">
          </div>
          <div class="input-group">
            <div class="slider-head"><span class="input-label" data-i18n="lblPlan"></span><span class="slider-val" id="val-plan"></span></div>
            <input class="rng" id="in-plan" type="range" min="12" max="72" step="6">
          </div>
          <div class="input-group">
            <div class="slider-head"><span class="input-label" data-i18n="lblValoriz"></span><span class="slider-val" id="val-valoriz"></span></div>
            <input class="rng" id="in-valoriz" type="range" min="3" max="50" step="0.5">
          </div>
          <div class="input-group">
            <div class="slider-head"><span class="input-label" data-i18n="lblCierre"></span><span class="slider-val" id="val-cierre"></span></div>
            <input class="rng" id="in-cierre" type="range" min="0" max="6" step="0.5">
          </div>
          <div class="input-group">
            <div class="slider-head"><span class="input-label" data-i18n="lblMargen"></span><span class="slider-val" id="val-margen"></span></div>
            <input class="rng" id="in-margen" type="range" min="0" max="25" step="1">
          </div>
          <div class="input-group">
            <span class="input-label" data-i18n="lblVehiculo"></span>
            <select class="sel-fiscal" id="sel-vehiculo"></select>
          </div>
          <p class="sec-note" id="veh-nota"></p>
          <div class="input-group">
            <div class="slider-head"><span class="input-label" data-i18n="lblTax"></span><span class="slider-val" id="val-tax"></span></div>
            <input class="rng" id="in-tax" type="range" min="0" max="40" step="1">
          </div>
          <div class="toggle-row">
            <div>
              <div class="input-label" data-i18n="lblDiferimiento"></div>
              <div class="toggle-sub" id="dif-label"></div>
            </div>
            <button type="button" id="dif-toggle" class="switch" role="switch" aria-label="Tax deferral"><span class="switch-knob"></span></button>
          </div>

          <div class="hairline"></div>

          <!-- business model: entry + exit -->
          <div class="eyebrow" data-i18n="secModelo"></div>
          <div class="input-group input-group-tight">
            <span class="input-label" data-i18n="lblEntrada"></span>
            <div class="seg seg-2x2" id="seg-entrada"></div>
          </div>
          <div class="input-group" id="grp-entpremium">
            <div class="slider-head"><span class="input-label" data-i18n="lblEntPremium"></span><span class="slider-val" id="val-entpremium"></span></div>
            <input class="rng" id="in-entpremium" type="range" min="0" max="20" step="1">
          </div>
          <p class="sec-note" id="ent-nota"></p>
          <div class="input-group input-group-tight">
            <span class="input-label" data-i18n="lblSalida"></span>
            <div class="seg seg-3" id="seg-salida"></div>
          </div>
          <p class="sec-note" id="sal-nota"></p>
          <div class="input-group">
            <div class="slider-head"><span class="input-label" data-i18n="lblRentaBruta"></span><span class="slider-val" id="val-rentabruta"></span></div>
            <input class="rng" id="in-rentabruta" type="range" min="0" max="20" step="1">
          </div>
          <div class="input-group">
            <div class="slider-head"><span class="input-label" data-i18n="lblOcupacion"></span><span class="slider-val" id="val-ocupacion"></span></div>
            <input class="rng" id="in-ocupacion" type="range" min="0" max="100" step="5">
          </div>
          <div class="input-group">
            <div class="slider-head"><span class="input-label" data-i18n="lblOpex"></span><span class="slider-val" id="val-opex"></span></div>
            <input class="rng" id="in-opex" type="range" min="0" max="50" step="1">
          </div>
          <div class="input-group">
            <div class="slider-head"><span class="input-label" data-i18n="lblRentaTax"></span><span class="slider-val" id="val-rentatax"></span></div>
            <input class="rng" id="in-rentatax" type="range" min="0" max="40" step="1">
          </div>

          <div class="hairline"></div>

          <!-- financing at handover -->
          <div class="eyebrow" data-i18n="secFinanciacion"></div>
          <div class="input-group input-group-tight">
            <span class="input-label" data-i18n="lblFinTipo"></span>
            <div class="seg seg-2x2" id="seg-fintipo"></div>
          </div>
          <p class="sec-note" id="fin-nota"></p>
          <div class="input-group">
            <div class="slider-head"><span class="input-label" data-i18n="lblFinTasa"></span><span class="slider-val" id="val-fintasa"></span></div>
            <input class="rng" id="in-fintasa" type="range" min="0" max="18" step="0.5">
          </div>
          <div class="input-group">
            <div class="slider-head"><span class="input-label" data-i18n="lblFinPlazo"></span><span class="slider-val" id="val-finplazo"></span></div>
            <input class="rng" id="in-finplazo" type="range" min="3" max="30" step="1">
          </div>
          <div class="input-group" id="grp-ltv">
            <div class="slider-head"><span class="input-label" data-i18n="lblLtv"></span><span class="slider-val" id="val-ltv"></span></div>
            <input class="rng" id="in-ltv" type="range" min="40" max="80" step="5">
          </div>
        </div>

        <!-- ============================ RESULTS ============================ -->
        <div class="results-grid">

          <!-- IRR / TIR (accent) -->
          <div class="panel card card-accent">
            <div class="eyebrow" data-i18n="modTir"></div>
            <p class="card-help" data-i18n="modTirHelp"></p>
            <div class="hero-num-row">
              <span class="hero-num" id="tir-ap"></span>
              <span class="hero-num-unit">%</span>
            </div>
            <div class="hero-caption" data-i18n="tirCon"></div>
            <div class="verdict" id="tir-verdict"></div>
            <div class="tir-usd" id="tir-usd"><span data-i18n="tirUsdLbl"></span>: <span class="tir-usd-val" id="tir-usd-val"></span></div>
            <div class="card-footer card-footer-2">
              <div><div class="foot-num"><span id="tir-sin"></span>%</div><div class="foot-cap" data-i18n="tirSin"></div></div>

  <script>
    /* Registro del service worker — habilita instalación PWA y uso offline. */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('service-worker.js').catch(function () {});
      });
    }
  </script>
  <script type="module">
    // Recuperación de contraseña: el enlace "¿Olvidaste tu contraseña?" alterna
    // a una vista dedicada (misma tarjeta) con su propio campo de correo, botón
    // "Enviar enlace" y estado "Revisa tu correo". "Volver" regresa al login.
    import { pedirReset } from './auth-cliente.js';
    var $ = function (id) { return document.getElementById(id); };
    var loginCard = document.querySelector('#login .login-card');
    var forgotCard = $('forgot-card');
    function mostrar(vista) {
      var esForgot = vista === 'forgot';
      loginCard.hidden = esForgot;
      forgotCard.hidden = !esForgot;
      $('forgot-msg').hidden = true;
      if (esForgot) {
        var v = ($('login-email') || {}).value || '';
        $('forgot-email').value = /@/.test(v) ? v : '';
        $('forgot-email').placeholder = (window.__forgotTr && window.__forgotTr.placeholder) || 'your@email.com';
        setTimeout(function () { $('forgot-email').focus(); }, 40);
      }
    }
    var link = document.querySelector('#login .login-help .link-muted');
    if (link) link.addEventListener('click', function (e) { e.preventDefault(); mostrar('forgot'); });
    $('forgot-back').addEventListener('click', function (e) { e.preventDefault(); mostrar('login'); });
    $('forgot-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      var btn = $('forgot-btn'), msg = $('forgot-msg');
      var email = $('forgot-email').value || '';
      btn.disabled = true;
      msg.hidden = false;
      msg.style.color = '#E6C788';
      msg.textContent = (window.__forgotTr && window.__forgotTr.sending) || 'Enviando…';
      var r = await pedirReset(email);
      btn.disabled = false;
      msg.textContent = r.mensaje;
      msg.style.color = r.ok ? '#E6C788' : '';
    });
  </script>
